<html lang="en">

<title>CircleUp Community</title>
<style>
:root{--p:#4f46e5;--p2:#7c3aed;--bg:#f6f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--danger:#be123c;--ok:#059669;--shadow:0 8px 30px rgba(15,23,42,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;padding-bottom:76px}.topbar{position:sticky;top:0;z-index:20;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900}.logo{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--p),#a855f7);display:grid;place-items:center;color:white;box-shadow:0 8px 18px rgba(79,70,229,.25)}.top-actions{display:flex;gap:8px}.icon-btn{width:42px;height:42px;border:none;border-radius:14px;background:#f1f5f9;display:grid;place-items:center;color:#334155;font-size:20px}.page{max-width:680px;margin:0 auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.composer-mini{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:14px}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#e0e7ff;flex:none}.avatar.sm{width:34px;height:34px}.avatar.lg{width:88px;height:88px}.fake-input{flex:1;border:1px solid var(--line);background:#f8fafc;color:#64748b;border-radius:999px;padding:12px 15px;text-align:left}.post{margin-bottom:14px;overflow:hidden}.post-head{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}.post-meta{flex:1;min-width:0}.name{font-weight:800;font-size:15px}.handle,.time,.muted{color:var(--muted);font-size:13px}.post-text{padding:6px 14px 12px;font-size:16px;line-height:1.52;white-space:pre-wrap}.media-grid{display:grid;gap:2px;background:#e2e8f0}.media-grid.one{grid-template-columns:1fr}.media-grid.two{grid-template-columns:1fr 1fr}.media-grid.many{grid-template-columns:1fr 1fr}.media-grid img,.media-grid video{width:100%;max-height:420px;object-fit:cover;background:#0f172a;display:block}.media-grid.many>*:first-child:nth-last-child(3){grid-row:span 2;height:100%}.counts{display:flex;justify-content:space-between;padding:9px 14px;color:#64748b;font-size:13px;border-bottom:1px solid #eef2f7}.post-actions{display:grid;grid-template-columns:repeat(3,1fr);padding:4px 8px 8px}.post-actions button{border:none;background:transparent;padding:11px 6px;border-radius:12px;font-weight:750;color:#475569}.post-actions button.active{color:#e11d48}.post-actions button:hover{background:#f8fafc}.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;height:70px;padding-bottom:max(env(safe-area-inset-bottom),5px);background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}.nav-btn{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#64748b;font-size:11px;font-weight:750}.nav-btn b{font-size:21px;line-height:1}.nav-btn.active{color:var(--p)}.nav-btn.create b{width:42px;height:42px;border-radius:16px;background:linear-gradient(135deg,var(--p),var(--p2));color:white;display:grid;place-items:center;box-shadow:0 8px 18px rgba(79,70,229,.28);margin-top:-18px}.section-title{font-size:18px;font-weight:900;margin:4px 2px 12px}.list{display:flex;flex-direction:column;gap:10px}.row{display:flex;align-items:center;gap:12px;padding:13px}.row-main{flex:1;min-width:0}.row .right{margin-left:auto}.pill{border:none;border-radius:999px;padding:9px 14px;font-weight:800;background:#eef2ff;color:var(--p)}.pill.primary{background:var(--p);color:white}.pill.danger{background:#fff1f2;color:var(--danger)}.pill.ghost{background:#f8fafc;color:#475569;border:1px solid var(--line)}.field{width:100%;border:1px solid #cbd5e1;border-radius:15px;background:#fff;padding:13px 14px;outline:none}.field:focus{border-color:#818cf8;box-shadow:0 0 0 4px #eef2ff}.textarea{min-height:110px;resize:vertical}.form{display:flex;flex-direction:column;gap:12px}.label{font-size:13px;font-weight:800;color:#475569;margin-bottom:-5px}.btn{border:none;border-radius:15px;padding:13px 16px;font-weight:850}.btn.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:white}.btn.secondary{background:#eef2ff;color:var(--p)}.btn.danger{background:#e11d48;color:white}.btn.ghost{background:#f1f5f9;color:#334155}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#eef2ff 0,#f8fafc 44%,#f1f5f9 100%)}.auth-card{width:min(460px,100%);padding:24px;border-radius:28px;background:white;border:1px solid #e2e8f0;box-shadow:0 22px 70px rgba(79,70,229,.13)}.auth-logo{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--p),#a855f7);color:white;display:grid;place-items:center;font-size:28px;font-weight:900;margin-bottom:12px}.auth-card h1{margin:0 0 4px;font-size:28px}.auth-card p{margin:0 0 20px;color:#64748b}.auth-links{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:14px}.link{border:none;background:none;padding:0;color:var(--p);font-weight:800}.back-title{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}.back{border:none;background:#f1f5f9;width:40px;height:40px;border-radius:13px;font-size:20px}.profile-hero{padding:20px;text-align:center}.profile-name{font-size:22px;font-weight:900;margin-top:8px}.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--line);padding-top:14px}.stat strong{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}.profile-actions{display:flex;gap:9px;margin-top:16px}.profile-actions .btn{flex:1}.group-cover{height:150px;border-radius:22px 22px 0 0;background:linear-gradient(135deg,#4f46e5,#c026d3);display:grid;place-items:center;color:white;font-size:48px;font-weight:900;overflow:hidden}.group-cover img{width:100%;height:100%;object-fit:cover}.group-body{padding:16px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#4f46e5;font-size:12px;font-weight:800}.notification.unread{background:#eef2ff}.empty{padding:34px 20px;text-align:center;color:#64748b}.empty .big{font-size:42px}.modal-wrap{position:fixed;z-index:100;inset:0;background:rgba(15,23,42,.48);display:grid;place-items:center;padding:20px}.modal{width:min(430px,100%);background:white;border-radius:24px;padding:20px;box-shadow:0 26px 70px rgba(15,23,42,.25)}.modal h3{margin:0 0 8px}.modal-actions{display:flex;gap:10px;margin-top:16px}.modal-actions .btn{flex:1}.toast{position:fixed;z-index:120;left:50%;bottom:86px;transform:translateX(-50%);background:#0f172a;color:white;padding:11px 15px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:var(--shadow);max-width:90vw;text-align:center}.loader{width:24px;height:24px;border:3px solid #e2e8f0;border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}.media-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.preview-item{position:relative;border-radius:14px;overflow:hidden;background:#e2e8f0;aspect-ratio:1}.preview-item img,.preview-item video{width:100%;height:100%;object-fit:cover}.remove-media{position:absolute;top:5px;right:5px;border:none;background:rgba(15,23,42,.78);color:white;width:27px;height:27px;border-radius:50%}.upload-row{display:flex;gap:8px;flex-wrap:wrap}.upload-row .btn{padding:10px 12px}.comment{display:flex;gap:9px;padding:11px 0;border-bottom:1px solid #f1f5f9}.comment.reply{margin-left:42px}.comment-bubble{flex:1;background:#f8fafc;border-radius:16px;padding:9px 11px}.chat{display:flex;flex-direction:column;gap:8px;padding:12px 0}.bubble{max-width:82%;padding:10px 12px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(15,23,42,.04)}.bubble.me{align-self:flex-end;background:#4f46e5;color:white;border-color:#4f46e5}.bubble .time{margin-top:4px;font-size:11px;color:inherit;opacity:.72}.chat-composer{position:sticky;bottom:76px;background:rgba(246,247,251,.96);padding:10px 0;display:flex;gap:8px}.chat-composer .field{flex:1}.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eef2f7}.switch{position:relative;width:48px;height:28px;border-radius:999px;background:#cbd5e1;border:none;transition:.2s}.switch.on{background:#4f46e5}.switch:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:white;top:3px;left:3px;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}.switch.on:after{left:23px}.offline{position:sticky;top:62px;z-index:15;background:#fff7ed;color:#9a3412;padding:9px 14px;text-align:center;border-bottom:1px solid #fed7aa;font-size:13px;font-weight:750}.fab{position:fixed;right:18px;bottom:88px;width:54px;height:54px;border-radius:18px;border:none;background:linear-gradient(135deg,var(--p),var(--p2));color:white;font-size:26px;box-shadow:0 12px 30px rgba(79,70,229,.35)}@media(min-width:760px){.page{padding:20px}.bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:680px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:22px 22px 0 0}.topbar{padding-left:max(16px,calc((100vw - 680px)/2));padding-right:max(16px,calc((100vw - 680px)/2))}.post,.card{border-radius:24px}}
</style>

<body>
<div id="root"></div>
<div id="toast" class="toast hidden"></div>
<div id="modal-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
const SUPABASE_URL='https://yinwwtcmednrybruzqhn.supabase.co';
const SUPABASE_KEY='sb_publishable_1lq290w39mduD56A-Dfwzg_zWZNf1Sc';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const root=document.getElementById('root'),toastEl=document.getElementById('toast'),modalRoot=document.getElementById('modal-root');
const state={session:null,me:null,profiles:[],follows:[],posts:[],groups:[],members:[],notifications:[],conversations:[],screen:'login',tab:'home',selected:null,loading:false,offline:!navigator.onLine,postMedia:[],chatMedia:[],replyTo:null};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmtTime=v=>{if(!v)return'';const d=new Date(v),s=Math.max(0,(Date.now()-d)/1000);if(s<60)return'Just now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<604800)return Math.floor(s/86400)+'d';return d.toLocaleDateString()};
const avatar=p=>p?.avatar_url||'/icon.svg';
function toast(msg){toastEl.textContent=msg;toastEl.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.add('hidden'),2600)}
function modal(title,body,confirmText,onConfirm,danger=false){modalRoot.innerHTML=`<div class="modal-wrap"><div class="modal"><h3>${esc(title)}</h3><div class="muted">${esc(body)}</div><div class="modal-actions"><button class="btn ghost" id="modalCancel">Cancel</button><button class="btn ${danger?'danger':'primary'}" id="modalOk">${esc(confirmText)}</button></div></div></div>`;document.getElementById('modalCancel').onclick=()=>modalRoot.innerHTML='';document.getElementById('modalOk').onclick=async()=>{modalRoot.innerHTML='';await onConfirm()}}
window.addEventListener('online',()=>{state.offline=false;render();refreshAll(false)});window.addEventListener('offline',()=>{state.offline=true;render()});
function person(id){return state.profiles.find(p=>p.id===id)||{id,full_name:'CircleUp member',username:'member',avatar_url:null,bio:''}}
function followers(id){return state.follows.filter(f=>f.following_id===id).length}function following(id){return state.follows.filter(f=>f.follower_id===id).length}function amFollowing(id){return state.follows.some(f=>f.follower_id===state.me?.id&&f.following_id===id)}
function header(title,back=false){return `<div class="topbar"><div class="brand">${back?'<button class="back" data-action="back">‹</button>':'<span class="logo">C</span>'}<span>${esc(title||'CircleUp')}</span></div><div class="top-actions">${!back?'<button class="icon-btn" data-action="search">⌕</button><button class="icon-btn" data-action="settings">⚙</button>':''}</div></div>${state.offline?'<div class="offline">You are offline. Some actions will wait until you reconnect.</div>':''}`}
function nav(){return `<nav class="bottom-nav">${[['home','⌂','Home'],['groups','◉','Groups'],['create','＋','Create'],['activity','♡','Activity'],['messages','✉','Messages']].map(([k,i,l])=>`<button class="nav-btn ${state.tab===k?'active':''} ${k==='create'?'create':''}" data-tab="${k}"><b>${i}</b><span>${l}</span></button>`).join('')}</nav>`}
function shell(content,title='CircleUp',back=false){return `<div class="app">${header(title,back)}<main class="page">${content}</main>${back?'':nav()}</div>`}
function authView(mode){const signup=mode==='signup',forgot=mode==='forgot';return `<div class="auth-wrap"><div class="auth-card"><div class="auth-logo">C</div><h1>${forgot?'Reset password':signup?'Create your account':'Welcome back'}</h1><p>${forgot?'We will email you a secure reset link.':signup?'Join your community on CircleUp.':'Sign in to continue to CircleUp.'}</p><form class="form" id="authForm">${signup?'<label class="label">Full name</label><input class="field" name="name" autocomplete="name" required placeholder="Your full name">':''}<label class="label">Email</label><input class="field" name="email" type="email" autocomplete="email" required placeholder="you@example.com">${forgot?'':`<label class="label">Password</label><input class="field" name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" minlength="6" required placeholder="••••••••">${signup?'<label class="label">Confirm password</label><input class="field" name="confirm" type="password" minlength="6" required placeholder="••••••••">':''}`}<button class="btn primary" type="submit">${forgot?'Send reset link':signup?'Create account':'Sign in'}</button></form><div class="auth-links">${forgot?'<button class="link" data-auth="login">Back to sign in</button>':`<button class="link" data-auth="${signup?'login':'signup'}">${signup?'Already have an account? Sign in':'Create account'}</button>${signup?'':'<button class="link" data-auth="forgot">Forgot password?</button>'}`}</div></div></div>`}
function homeView(){const cards=state.posts.length?state.posts.map(postCard).join(''):`<div class="card empty"><div class="big">✦</div><h3>No posts yet</h3><p>Be the first person to share something.</p><button class="btn primary" data-tab="create">Create first post</button></div>`;return shell(`<div class="card composer-mini"><img class="avatar" src="${esc(avatar(state.me))}"><button class="fake-input" data-tab="create">Share something with your community…</button></div>${cards}`)}
function postCard(p){const a=person(p.user_id),likes=p.post_likes?.length||0,liked=(p.post_likes||[]).some(x=>x.user_id===state.me.id),comments=p.comments?.length||0,media=(p.post_media||[]);let cls=media.length===1?'one':media.length===2?'two':'many';let mediaHtml=media.length?`<div class="media-grid ${cls}">${media.map(m=>m.type==='video'?`<video controls playsinline src="${esc(m.url)}"></video>`:`<img loading="lazy" src="${esc(m.url)}">`).join('')}</div>`:'';return `<article class="card post"><div class="post-head"><img class="avatar" src="${esc(avatar(a))}" data-profile="${a.id}"><div class="post-meta"><div class="name" data-profile="${a.id}">${esc(a.full_name||a.username||'Member')}</div><div class="handle">@${esc(a.username||'member')} · ${fmtTime(p.created_at)}${p.groups?.name?' · '+esc(p.groups.name):''}</div></div>${p.user_id===state.me.id?`<button class="icon-btn" data-delete-post="${p.id}">⋯</button>`:''}</div>${p.content?`<div class="post-text">${esc(p.content)}</div>`:''}${mediaHtml}<div class="counts"><span>${likes} ${likes===1?'like':'likes'}</span><span>${comments} ${comments===1?'comment':'comments'}</span></div><div class="post-actions"><button class="${liked?'active':''}" data-like="${p.id}">♥ Like</button><button data-open-post="${p.id}">💬 Comment</button><button data-share-post="${p.id}">↗ Share</button></div></article>`}
function createView(){const joined=state.groups.filter(g=>state.members.some(m=>m.group_id===g.id&&m.user_id===state.me.id));return shell(`<section class="card" style="padding:16px"><div class="section-title">Create a post</div><form class="form" id="postForm"><textarea class="field textarea" name="content" placeholder="What is happening?"></textarea><select class="field" name="group"><option value="">Post to Home</option>${joined.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select><div class="upload-row"><button class="btn secondary" type="button" id="pickPostMedia">📷 Add photos/video</button></div><input id="postFiles" class="hidden" type="file" accept="image/*,video/*" multiple><div id="postPreview" class="media-preview">${previewMedia(state.postMedia)}</div><div class="muted">Up to 5 photos and 1 video (10 seconds maximum). Photos and video can be posted together.</div><button class="btn primary" type="submit">Post</button></form></section>`,'Create post')}
function previewMedia(arr){return arr.map((m,i)=>`<div class="preview-item">${m.type==='video'?`<video muted playsinline src="${m.url}"></video>`:`<img src="${m.url}">`}<button class="remove-media" type="button" data-remove-media="${i}">×</button></div>`).join('')}
function groupsView(){return shell(`<div style="display:flex;justify-content:space-between;align-items:center"><div class="section-title">Groups</div><button class="pill primary" data-action="new-group">+ Create</button></div><div class="list">${state.groups.length?state.groups.map(g=>{const joined=state.members.some(m=>m.group_id===g.id&&m.user_id===state.me.id),count=state.members.filter(m=>m.group_id===g.id).length;return `<div class="card row" data-open-group="${g.id}"><div class="logo">${esc(g.name.slice(0,1).toUpperCase())}</div><div class="row-main"><div class="name">${esc(g.name)}</div><div class="muted">${esc(g.category||'Community')} · ${count} members</div></div><button class="pill ${joined?'ghost':'primary'}" data-group-toggle="${g.id}">${joined?'Joined':'Join'}</button></div>`}).join(''):'<div class="card empty">No groups yet.</div>'}</div>`,'Groups')}
function activityView(){return shell(`<div class="section-title">Activity</div><div class="list">${state.notifications.length?state.notifications.map(n=>{const a=person(n.actor_id),txt=n.type==='like'?'liked your post':n.type==='comment'?'commented on your post':n.type==='reply'?'replied to your comment':n.type==='follow'?'started following you':n.type==='message'?'sent you a message':n.type==='group_join'?'joined your group':'sent an update';return `<div class="card row notification ${n.read?'':'unread'}" data-notification="${n.id}" data-n-type="${esc(n.type)}" data-post="${n.post_id||''}" data-conversation="${n.conversation_id||''}" data-group="${n.group_id||''}" data-actor="${n.actor_id||''}"><img class="avatar" src="${esc(avatar(a))}"><div class="row-main"><div><b>${esc(a.full_name||'Someone')}</b> ${txt}</div><div class="muted">${fmtTime(n.created_at)}</div></div></div>`}).join(''):'<div class="card empty"><div class="big">✓</div><h3>All caught up</h3><p>No new notifications.</p></div>'}</div>`,'Activity')}
async function loadConversations(){const {data:parts,error}=await sb.from('conversation_participants').select('conversation_id,user_id,joined_at,conversations(id,updated_at)').eq('user_id',state.me.id);if(error)throw error;const ids=(parts||[]).map(x=>x.conversation_id);if(!ids.length){state.conversations=[];return}const {data:allParts}=await sb.from('conversation_participants').select('conversation_id,user_id').in('conversation_id',ids);const {data:msgs}=await sb.from('messages').select('*').in('conversation_id',ids).order('created_at',{ascending:false});state.conversations=ids.map(cid=>{const other=(allParts||[]).find(x=>x.conversation_id===cid&&x.user_id!==state.me.id);const last=(msgs||[]).find(m=>m.conversation_id===cid);return{id:cid,other:other?person(other.user_id):person(state.me.id),last,unread:(msgs||[]).filter(m=>m.conversation_id===cid&&m.sender_id!==state.me.id&&!m.read_at).length}}).sort((a,b)=>new Date(b.last?.created_at||0)-new Date(a.last?.created_at||0))}
function messagesView(){return shell(`<div style="display:flex;justify-content:space-between;align-items:center"><div class="section-title">Messages</div><button class="pill primary" data-action="new-message">+ New</button></div><div class="list">${state.conversations.length?state.conversations.map(c=>`<div class="card row" data-open-chat="${c.id}"><img class="avatar" src="${esc(avatar(c.other))}"><div class="row-main"><div class="name">${esc(c.other.full_name||c.other.username)}</div><div class="muted">${esc(c.last?.content||'Start a conversation')}</div></div>${c.unread?`<span class="badge">${c.unread}</span>`:''}</div>`).join(''):'<div class="card empty"><div class="big">✉</div><h3>No messages</h3><p>Start a new chat with someone in your community.</p><button class="btn primary" data-action="new-message">Start a new chat</button></div>'}</div>`,'Messages')}
function profileView(id){const p=person(id||state.me.id),self=p.id===state.me.id;const postCount=state.posts.filter(x=>x.user_id===p.id).length;return shell(`<section class="card profile-hero"><img class="avatar lg" src="${esc(avatar(p))}"><div class="profile-name">${esc(p.full_name||p.username)}</div><div class="muted">@${esc(p.username||'member')}</div><p>${esc(p.bio||'No bio yet.')}</p><div class="profile-stats"><div class="stat"><strong>${postCount}</strong><span>Posts</span></div><button class="stat link" data-followers="${p.id}"><strong>${followers(p.id)}</strong><span>Followers</span></button><button class="stat link" data-following="${p.id}"><strong>${following(p.id)}</strong><span>Following</span></button></div><div class="profile-actions">${self?'<button class="btn secondary" data-action="edit-profile">Edit profile</button><button class="btn ghost" data-action="settings">Settings</button>':`<button class="btn ${amFollowing(p.id)?'secondary':'primary'}" data-follow="${p.id}">${amFollowing(p.id)?'Unfollow':'Follow'}</button><button class="btn ghost" data-message-user="${p.id}">Message</button>`}</div></section><div class="section-title" style="margin-top:18px">Posts</div>${state.posts.filter(x=>x.user_id===p.id).map(postCard).join('')||'<div class="card empty">No posts yet.</div>'}`,'Profile',true)}

function postDetailView(id){const p=state.posts.find(x=>x.id===id);if(!p)return shell('<div class="card empty">Post not found.</div>','Post',true);return shell(`${postCard(p)}<section class="card" style="padding:14px"><div class="section-title">Comments</div>${(p.comments||[]).map(c=>{const a=person(c.user_id);return `<div class="comment ${c.parent_id?'reply':''}"><img class="avatar sm" src="${esc(avatar(a))}"><div class="comment-bubble"><div class="name">${esc(a.full_name||a.username)}</div><div>${esc(c.content)}</div><button class="link" data-reply="${c.id}">Reply</button></div></div>`}).join('')||'<div class="muted">No comments yet.</div>'}<form id="commentForm" class="form" style="margin-top:12px"><input class="field" name="comment" placeholder="${state.replyTo?'Write a reply…':'Write a comment…'}" required><button class="btn primary">${state.replyTo?'Reply':'Comment'}</button></form></section>`,'Post',true)}

function newMessageView(){const others=state.profiles.filter(p=>p.id!==state.me.id);return shell(`<div class="section-title">New message</div><div class="list">${others.map(p=>`<div class="card row"><img class="avatar" src="${esc(avatar(p))}"><div class="row-main"><div class="name">${esc(p.full_name||p.username)}</div><div class="muted">@${esc(p.username||'member')}</div></div><button class="pill primary" data-message-user="${p.id}">Message</button></div>`).join('')||'<div class="card empty">No other members yet.</div>'}</div>`,'New message',true)}

async function renderChatData(cid){const {data:parts}=await sb.from('conversation_participants').select('user_id').eq('conversation_id',cid);const otherId=(parts||[]).map(x=>x.user_id).find(x=>x!==state.me.id)||state.me.id;const other=person(otherId);const {data:msgs,error}=await sb.from('messages').select('*').eq('conversation_id',cid).order('created_at',{ascending:true});if(error){toast(error.message);return}const ids=(msgs||[]).map(m=>m.id);let media=[];if(ids.length){const r=await sb.from('message_media').select('*').in('message_id',ids).order('sort_order');media=r.data||[]}const signed={};for(const m of media){const r=await sb.storage.from('message-media').createSignedUrl(m.storage_path,3600);if(r.data?.signedUrl)signed[m.id]=r.data.signedUrl}const area=document.getElementById('chatArea');if(!area)return;area.innerHTML=`<div class="card row"><img class="avatar" src="${esc(avatar(other))}"><div class="row-main"><div class="name">${esc(other.full_name||other.username)}</div><div class="muted">Private conversation</div></div></div><div class="chat">${(msgs||[]).map(m=>{const mm=media.filter(x=>x.message_id===m.id);return `<div class="bubble ${m.sender_id===state.me.id?'me':''}">${m.content?`<div>${esc(m.content)}</div>`:''}${mm.map(x=>x.type==='video'?`<video controls playsinline style="max-width:240px;width:100%;border-radius:12px;margin-top:6px" src="${esc(signed[x.id]||'')}"></video>`:`<img style="max-width:240px;width:100%;border-radius:12px;margin-top:6px" src="${esc(signed[x.id]||'')}">`).join('')}<div class="time">${fmtTime(m.created_at)}</div></div>`}).join('')||'<div class="empty">Start the conversation.</div>'}</div><form id="chatForm" class="chat-composer"><button class="icon-btn" type="button" id="pickChatMedia">＋</button><input id="chatFiles" class="hidden" type="file" accept="image/*,video/*" multiple><input class="field" name="message" placeholder="Message…"><button class="btn primary">Send</button></form><div class="media-preview" id="chatPreview">${previewMedia(state.chatMedia)}</div>`;bindChat(cid);await sb.from('messages').update({read_at:new Date().toISOString()}).eq('conversation_id',cid).neq('sender_id',state.me.id).is('read_at',null)}
function editProfileView(){return shell(`<section class="card" style="padding:16px"><div class="section-title">Edit profile</div><form class="form" id="profileForm"><div style="text-align:center"><img class="avatar lg" src="${esc(avatar(state.me))}" id="avatarPreview"><br><button class="btn secondary" type="button" id="pickAvatar">Change photo</button><input id="avatarFile" class="hidden" type="file" accept="image/*"></div><label class="label">Full name</label><input class="field" name="name" required value="${esc(state.me.full_name||'')}"><label class="label">Bio</label><textarea class="field textarea" name="bio">${esc(state.me.bio||'')}</textarea><button class="btn primary">Save changes</button></form></section>`,'Edit profile',true)}

function render(){if(!state.session){root.innerHTML=authView(state.screen==='signup'?'signup':state.screen==='forgot'?'forgot':'login');bind();return}if(state.loading){root.innerHTML=`<div class="auth-wrap"><div><div class="auth-logo">C</div><div class="loader"></div></div></div>`;return}let html;if(state.screen==='profile')html=profileView(state.selected||state.me.id);else if(state.screen==='followers')html=followListView(state.selected,'followers');else if(state.screen==='following')html=followListView(state.selected,'following');else if(state.screen==='post')html=postDetailView(state.selected);else if(state.screen==='group')html=groupDetailView(state.selected);else if(state.screen==='create-group')html=createGroupView();else if(state.screen==='new-message')html=newMessageView();else if(state.screen==='chat')html=chatView(state.selected);else if(state.screen==='edit-profile')html=editProfileView();else if(state.screen==='settings')html=settingsView();else if(state.screen==='privacy')html=privacyView();else if(state.screen==='notifications')html=notificationsView();else if(state.screen==='search')html=searchView();else if(state.screen==='install')html=installView();else html=state.tab==='home'?homeView():state.tab==='groups'?groupsView():state.tab==='create'?createView():state.tab==='activity'?activityView():messagesView();root.innerHTML=html;bind();if(state.screen==='chat')renderChatData(state.selected);if(state.screen==='search')bindSearch()}
async function refreshAll(show=true){if(!state.session)return;try{if(show){state.loading=true;render()}const uid=state.session.user.id;const [pr,fr,gr,mr]=await Promise.all([sb.from('profiles').select('*').order('created_at'),sb.from('follows').select('*'),sb.from('groups').select('*').order('created_at',{ascending:false}),sb.from('group_members').select('*')]);if(pr.error)throw pr.error;if(fr.error)throw fr.error;if(gr.error)throw gr.error;if(mr.error)throw mr.error;state.profiles=pr.data||[];state.follows=fr.data||[];state.groups=gr.data||[];state.members=mr.data||[];state.me=state.profiles.find(p=>p.id===uid)||{id:uid,full_name:state.session.user.user_metadata?.full_name||'CircleUp member',username:(state.session.user.email||'member').split('@')[0],bio:'',avatar_url:null};const posts=await sb.from('posts').select('*,profiles!posts_user_id_fkey(id,username,full_name,avatar_url),groups(name),post_media(*),post_likes(user_id),comments(*)').order('created_at',{ascending:false});if(posts.error)throw posts.error;state.posts=posts.data||[];const nr=await sb.from('notifications').select('*').eq('user_id',uid).order('created_at',{ascending:false}).limit(100);state.notifications=nr.data||[];await loadConversations();state.loading=false;render()}catch(e){state.loading=false;toast(e.message||'Could not load CircleUp');render()}}
async function validateMedia(files,maxPhotos=5,maxVideos=1){const arr=[];let photos=0,videos=0;for(const f of files){if(f.type.startsWith('image/')){photos++;if(photos>maxPhotos)throw new Error(`Maximum ${maxPhotos} photos`);arr.push({file:f,type:'image',url:URL.createObjectURL(f)})}else if(f.type.startsWith('video/')){videos++;if(videos>maxVideos)throw new Error(`Maximum ${maxVideos} video`);const duration=await videoDuration(f);if(duration>10.2)throw new Error('Video must be 10 seconds or shorter');arr.push({file:f,type:'video',url:URL.createObjectURL(f),duration})}}return arr}
function videoDuration(file){return new Promise((res,rej)=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{URL.revokeObjectURL(v.src);res(v.duration||0)};v.onerror=()=>rej(new Error('Could not read video'));v.src=URL.createObjectURL(file)})}
async function uploadPostMedia(postId,items){let order=0;for(const m of items){const ext=(m.file.name.split('.').pop()||'bin').toLowerCase();const path=`${state.me.id}/${postId}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const up=await sb.storage.from('post-media').upload(path,m.file,{upsert:false});if(up.error)throw up.error;const pub=sb.storage.from('post-media').getPublicUrl(path).data.publicUrl;const ins=await sb.from('post_media').insert({post_id:postId,user_id:state.me.id,url:pub,type:m.type,sort_order:order++,duration_seconds:m.duration||null});if(ins.error)throw ins.error}}
async function uploadMessageMedia(cid,msgId,items){let order=0;for(const m of items){const ext=(m.file.name.split('.').pop()||'bin').toLowerCase();const path=`${cid}/${state.me.id}/${msgId}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const up=await sb.storage.from('message-media').upload(path,m.file);if(up.error)throw up.error;const ins=await sb.from('message_media').insert({message_id:msgId,conversation_id:cid,user_id:state.me.id,storage_path:path,type:m.type,sort_order:order++,duration_seconds:m.duration||null});if(ins.error)throw ins.error}}
async function toggleFollow(id){const yes=amFollowing(id);const q=yes?sb.from('follows').delete().eq('follower_id',state.me.id).eq('following_id',id):sb.from('follows').insert({follower_id:state.me.id,following_id:id});const r=await q;if(r.error)toast(r.error.message);else await refreshAll(false)}
async function toggleGroup(id){const joined=state.members.some(m=>m.group_id===id&&m.user_id===state.me.id);if(joined){const g=state.groups.find(x=>x.id===id);if(g?.created_by===state.me.id)return toast('Group owners cannot leave their own group');modal('Leave group?','You can join again later.','Leave',async()=>{const r=await sb.from('group_members').delete().eq('group_id',id).eq('user_id',state.me.id);if(r.error)toast(r.error.message);else await refreshAll(false)},true)}else{const r=await sb.from('group_members').insert({group_id:id,user_id:state.me.id,role:'member'});if(r.error)toast(r.error.message);else await refreshAll(false)}}
async function likePost(id){const p=state.posts.find(x=>x.id===id),liked=(p?.post_likes||[]).some(x=>x.user_id===state.me.id);const r=liked?await sb.from('post_likes').delete().eq('post_id',id).eq('user_id',state.me.id):await sb.from('post_likes').insert({post_id:id,user_id:state.me.id});if(r.error)toast(r.error.message);else await refreshAll(false)}
async function startMessage(uid){try{const p=person(uid);if(p.allow_messages==='none')return toast('This member is not accepting messages');if(p.allow_messages==='followers'&&!state.follows.some(f=>f.follower_id===p.id&&f.following_id===state.me.id))return toast('Only this member’s followers can message them');const r=await sb.rpc('get_or_create_dm',{other_user_id:uid});if(r.error)throw r.error;state.selected=r.data;state.screen='chat';state.chatMedia=[];render()}catch(e){toast(e.message||'Could not start chat')}}
async function markNotification(el){const id=el.dataset.notification;await sb.from('notifications').update({read:true}).eq('id',id);const type=el.dataset.nType;if(el.dataset.post){state.selected=el.dataset.post;state.screen='post'}else if(el.dataset.conversation){state.selected=el.dataset.conversation;state.screen='chat'}else if(el.dataset.group){state.selected=el.dataset.group;state.screen='group'}else if(el.dataset.actor){state.selected=el.dataset.actor;state.screen='profile'}render()}
function bind(){document.querySelectorAll('[data-auth]').forEach(x=>x.onclick=()=>{state.screen=x.dataset.auth;render()});const af=document.getElementById('authForm');if(af)af.onsubmit=async e=>{e.preventDefault();const fd=new FormData(af),email=String(fd.get('email')||'').trim(),pass=String(fd.get('password')||''),name=String(fd.get('name')||'').trim();try{if(state.screen==='forgot'){const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});if(r.error)throw r.error;toast('Password reset email sent');state.screen='login';render()}else if(state.screen==='signup'){if(pass!==String(fd.get('confirm')||''))throw new Error('Passwords do not match');const r=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});if(r.error)throw r.error;toast(r.data.session?'Account created':'Check your email to confirm your account')}else{const r=await sb.auth.signInWithPassword({email,password:pass});if(r.error)throw r.error}}catch(err){toast(err.message)}};
document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=e=>{e.stopPropagation();state.tab=x.dataset.tab;state.screen='main';render()});document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>handleAction(x.dataset.action));document.querySelectorAll('[data-profile]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.profile;state.screen='profile';render()});document.querySelectorAll('[data-open-post]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.openPost;state.screen='post';state.replyTo=null;render()});document.querySelectorAll('[data-open-group]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-group-toggle]'))return;state.selected=x.dataset.openGroup;state.screen='group';render()});document.querySelectorAll('[data-open-chat]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.openChat;state.screen='chat';state.chatMedia=[];render()});document.querySelectorAll('[data-like]').forEach(x=>x.onclick=()=>likePost(x.dataset.like));document.querySelectorAll('[data-follow]').forEach(x=>x.onclick=()=>toggleFollow(x.dataset.follow));document.querySelectorAll('[data-group-toggle]').forEach(x=>x.onclick=e=>{e.stopPropagation();toggleGroup(x.dataset.groupToggle)});document.querySelectorAll('[data-message-user]').forEach(x=>x.onclick=()=>startMessage(x.dataset.messageUser));document.querySelectorAll('[data-followers]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.followers;state.screen='followers';render()});document.querySelectorAll('[data-following]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.following;state.screen='following';render()});document.querySelectorAll('[data-notification]').forEach(x=>x.onclick=()=>markNotification(x));document.querySelectorAll('[data-share-post]').forEach(x=>x.onclick=async()=>{const url=location.origin+'/?post='+x.dataset.sharePost;if(navigator.share)await navigator.share({title:'CircleUp post',url}).catch(()=>{});else{await navigator.clipboard?.writeText(url);toast('Post link copied')}});document.querySelectorAll('[data-delete-post]').forEach(x=>x.onclick=()=>modal('Delete post?','This cannot be undone.','Delete',async()=>{const r=await sb.from('posts').delete().eq('id',x.dataset.deletePost);if(r.error)toast(r.error.message);else await refreshAll(false)},true));document.querySelectorAll('[data-reply]').forEach(x=>x.onclick=()=>{state.replyTo=x.dataset.reply;render()});const cf=document.getElementById('commentForm');if(cf)cf.onsubmit=async e=>{e.preventDefault();const text=String(new FormData(cf).get('comment')||'').trim();if(!text)return;const r=await sb.from('comments').insert({post_id:state.selected,user_id:state.me.id,parent_id:state.replyTo||null,content:text});if(r.error)toast(r.error.message);else{state.replyTo=null;await refreshAll(false);state.screen='post';render()}};bindCreatePost();bindCreateGroup();bindProfile();bindPrefs()}
async function handleAction(a){if(a==='back'){state.screen='main';render()}else if(a==='search'){state.screen='search';render()}else if(a==='settings'){state.screen='settings';render()}else if(a==='new-group'){state.screen='create-group';render()}else if(a==='new-message'){state.screen='new-message';render()}else if(a==='edit-profile'){state.screen='edit-profile';render()}else if(a==='privacy'){state.screen='privacy';render()}else if(a==='notifications'){state.screen='notifications';render()}else if(a==='share-app'){if(navigator.share)navigator.share({title:'CircleUp Community',text:'Join me on CircleUp!',url:location.origin}).catch(()=>{});else{navigator.clipboard?.writeText(location.origin);toast('CircleUp link copied')}}else if(a==='install'||a==='install-now'){state.screen='install';render()}else if(a==='save-privacy'){const allow=document.getElementById('allowMessages')?.value||'everyone';const r=await sb.from('profiles').update({allow_messages:allow}).eq('id',state.me.id);if(r.error)toast(r.error.message);else{toast('Privacy saved');await refreshAll(false)}}else if(a==='logout'){modal('Log out?','You will need to sign in again.','Log out',async()=>{await sb.auth.signOut()})}else if(a==='delete-account'){modal('Delete account?','This permanently removes your CircleUp account and cannot be undone.','Delete account',async()=>{const r=await sb.rpc('delete_own_account');if(r.error)toast(r.error.message);else await sb.auth.signOut()},true)}}
function bindCreatePost(){const pick=document.getElementById('pickPostMedia'),inp=document.getElementById('postFiles');if(pick&&inp)pick.onclick=()=>inp.click();if(inp)inp.onchange=async()=>{try{state.postMedia=await validateMedia([...inp.files]);render()}catch(e){toast(e.message);inp.value=''}};document.querySelectorAll('[data-remove-media]').forEach(x=>x.onclick=()=>{state.postMedia.splice(Number(x.dataset.removeMedia),1);render()});const form=document.getElementById('postForm');if(form)form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form),content=String(fd.get('content')||'').trim(),group=String(fd.get('group')||'')||null;if(!content&&!state.postMedia.length)return toast('Add text, a photo, or a video');try{const r=await sb.from('posts').insert({user_id:state.me.id,group_id:group,content}).select('id').single();if(r.error)throw r.error;if(state.postMedia.length)await uploadPostMedia(r.data.id,state.postMedia);state.postMedia.forEach(m=>URL.revokeObjectURL(m.url));state.postMedia=[];state.tab='home';state.screen='main';await refreshAll(false);toast('Posted')}catch(e){toast(e.message||'Could not post')}}}
function bindCreateGroup(){const f=document.getElementById('groupForm');if(f)f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f);const r=await sb.from('groups').insert({name:String(fd.get('name')||'').trim(),category:String(fd.get('category')||'Community').trim(),description:String(fd.get('description')||'').trim(),created_by:state.me.id}).select('id').single();if(r.error)toast(r.error.message);else{await refreshAll(false);state.selected=r.data.id;state.screen='group';render();toast('Group created')}}}
function bindProfile(){const f=document.getElementById('profileForm'),pick=document.getElementById('pickAvatar'),inp=document.getElementById('avatarFile');if(pick&&inp)pick.onclick=()=>inp.click();if(inp)inp.onchange=()=>{const f=inp.files?.[0];if(f)document.getElementById('avatarPreview').src=URL.createObjectURL(f)};if(f)f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f);try{let avatarUrl=state.me.avatar_url;const file=inp?.files?.[0];if(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${state.me.id}/avatar-${Date.now()}.${ext}`;const up=await sb.storage.from('avatars').upload(path,file,{upsert:true});if(up.error)throw up.error;avatarUrl=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl}const r=await sb.from('profiles').update({full_name:String(fd.get('name')||'').trim(),bio:String(fd.get('bio')||'').trim(),avatar_url:avatarUrl}).eq('id',state.me.id);if(r.error)throw r.error;await refreshAll(false);state.screen='profile';state.selected=state.me.id;render();toast('Profile updated')}catch(err){toast(err.message)}}}
function bindPrefs(){document.querySelectorAll('[data-toggle="public"]').forEach(x=>x.onclick=async()=>{const r=await sb.from('profiles').update({is_private:!state.me.is_private}).eq('id',state.me.id);if(r.error)toast(r.error.message);else await refreshAll(false)});document.querySelectorAll('[data-pref]').forEach(x=>x.onclick=async()=>{const k=x.dataset.pref,val=state.me[k]!==false;const patch={};patch[k]=!val;const r=await sb.from('profiles').update(patch).eq('id',state.me.id);if(r.error)toast(r.error.message);else await refreshAll(false)})}
function bindChat(cid){const pick=document.getElementById('pickChatMedia'),inp=document.getElementById('chatFiles');if(pick&&inp)pick.onclick=()=>inp.click();if(inp)inp.onchange=async()=>{try{state.chatMedia=await validateMedia([...inp.files]);document.getElementById('chatPreview').innerHTML=previewMedia(state.chatMedia)}catch(e){toast(e.message)}};document.querySelectorAll('#chatPreview [data-remove-media]').forEach(x=>x.onclick=()=>{state.chatMedia.splice(Number(x.dataset.removeMedia),1);document.getElementById('chatPreview').innerHTML=previewMedia(state.chatMedia)});const f=document.getElementById('chatForm');if(f)f.onsubmit=async e=>{e.preventDefault();const text=String(new FormData(f).get('message')||'').trim();if(!text&&!state.chatMedia.length)return;try{const r=await sb.from('messages').insert({conversation_id:cid,sender_id:state.me.id,content:text}).select('id').single();if(r.error)throw r.error;if(state.chatMedia.length)await uploadMessageMedia(cid,r.data.id,state.chatMedia);state.chatMedia.forEach(m=>URL.revokeObjectURL(m.url));state.chatMedia=[];f.reset();await renderChatData(cid);await loadConversations()}catch(err){toast(err.message)}}}
function bindSearch(){const i=document.getElementById('searchInput'),out=document.getElementById('searchResults');if(!i||!out)return;const go=()=>{const q=i.value.trim().toLowerCase();if(!q){out.innerHTML='<div class="card empty">Start typing to search CircleUp.</div>';return}const pp=state.profiles.filter(p=>`${p.full_name} ${p.username} ${p.bio}`.toLowerCase().includes(q)).slice(0,10),gg=state.groups.filter(g=>`${g.name} ${g.description} ${g.category}`.toLowerCase().includes(q)).slice(0,10),po=state.posts.filter(p=>p.content.toLowerCase().includes(q)).slice(0,8);out.innerHTML=`${pp.length?'<div class="section-title">People</div>'+pp.map(p=>`<div class="card row" data-profile="${p.id}"><img class="avatar" src="${esc(avatar(p))}"><div class="row-main"><div class="name">${esc(p.full_name||p.username)}</div><div class="muted">@${esc(p.username||'member')}</div></div></div>`).join(''):''}${gg.length?'<div class="section-title" style="margin-top:15px">Groups</div>'+gg.map(g=>`<div class="card row" data-open-group="${g.id}"><div class="logo">${esc(g.name[0])}</div><div class="row-main"><div class="name">${esc(g.name)}</div><div class="muted">${esc(g.category)}</div></div></div>`).join(''):''}${po.length?'<div class="section-title" style="margin-top:15px">Posts</div>'+po.map(postCard).join(''):''}${!pp.length&&!gg.length&&!po.length?'<div class="card empty">No results.</div>':''}`;bind()};i.oninput=go;go()}
function setupRealtime(){sb.removeAllChannels();if(!state.session)return;sb.channel('circleup-live').on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:`user_id=eq.${state.session.user.id}`},()=>refreshAll(false)).on('postgres_changes',{event:'*',schema:'public',table:'messages'},payload=>{loadConversations().then(()=>{if(state.screen==='chat')renderChatData(state.selected);else render()})}).subscribe()}
async function boot(){const {data:{session}}=await sb.auth.getSession();state.session=session;if(session){state.screen='main';await refreshAll(true);setupRealtime()}else render();sb.auth.onAuthStateChange(async(event,session)=>{state.session=session;if(session){state.screen='main';await refreshAll(true);setupRealtime()}else{state.me=null;state.profiles=[];state.posts=[];state.groups=[];state.notifications=[];state.conversations=[];state.screen='login';render()}})}
boot();
})();
</script>
