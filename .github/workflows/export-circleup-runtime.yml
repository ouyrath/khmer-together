name: Export CircleUp runtime source

on:
  push:
    paths:
      - '.github/workflows/export-circleup-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode current CircleUp runtime
        shell: bash
        run: |
          base64 -d circleup-runtime/app-v3.gz.b64 | gzip -dc > circleup-runtime/app-v5-current.html
      - name: Commit exported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add circleup-runtime/app-v5-current.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Export CircleUp runtime source"
          git push
